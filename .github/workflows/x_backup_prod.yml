name: X - Backup Production Database

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  Backup:
    runs-on: ubuntu-24.04
    steps:
      - name: git add .Installer le client PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Définir le nom du fichier de backup
        id: filename
        run: echo "name=cesizen-prod-$(date +'%Y-%m-%d_%H-%M-%S').dump" >> "$GITHUB_OUTPUT"

      - name: Dump de la base Neon prod
        run: |
          pg_dump "${{ secrets.NEON_PROD_CONNECTION }}" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="${{ steps.filename.outputs.name }}"
          echo "Taille du dump :"
          ls -lh "${{ steps.filename.outputs.name }}"

      - name: Upload vers Azure Blob Storage
        run: |
          az storage blob upload \
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --container-name "${{ secrets.AZURE_BACKUP_CONTAINER }}" \
            --name "${{ steps.filename.outputs.name }}" \
            --file "${{ steps.filename.outputs.name }}" \
            --sas-token "${{ secrets.AZURE_STORAGE_SAS }}"
          echo "Backup uploadé : ${{ steps.filename.outputs.name }}"